```yaml
workflows:
  quotation-editor-ios:
    name: Quotation Editor - iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Check Xcode project
        script: |
          echo "Searching for Xcode project..."

          PROJECT=$(find "$CM_BUILD_DIR/ios" \
            -maxdepth 2 \
            -name "QuotationEditoriOS.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          echo "Found: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$CM_ENV"

      - name: List Xcode schemes
        script: |
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "QuotationEditoriOS" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/QuotationEditoriOS.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iOS application not found"
            find "$CM_BUILD_DIR/build/DerivedData/Build/Products" -name "*.app"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/output/Payload"

          ditto "$APP_PATH" \
            "$CM_BUILD_DIR/output/Payload/QuotationEditoriOS.app"

          cd "$CM_BUILD_DIR/output"

          zip -qry "$CM_BUILD_DIR/QuotationEditor-unsigned.ipa" Payload

          echo "IPA created successfully"

    artifacts:
      - QuotationEditor-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
```
